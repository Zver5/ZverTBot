site_name: ZverTBot
site_description: Документация ZverTBot — управление VPN-инфраструктурой, мониторинг VPS и интеграция с Home Assistant.
site_url: https://zver5.github.io/ZverTBot/
repo_url: https://github.com/Zver5/ZverTBot
repo_name: Zver5/ZverTBot
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: ru
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences

nav:
  - Главная: index.md
  - Развёртывание и перенос VPS: DEPLOY.md
  - Home Assistant: HASS.md
  - Технический паспорт: BOT-PASSPORT.md
  - Архитектура и навигация: MINDMAP.md
